[lint]
# Enable E (errors), F (pyflakes), I (isort), B (bugbear)
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # line too long - use formatter instead

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"tests/*" = ["F401", "F811"]  # test fixtures

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"